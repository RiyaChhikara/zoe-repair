<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>How repairable is your phone?</title>
  <meta name="description" content="Three short questions about whether you can open, fix, and keep your phone.">
  <meta property="og:title" content="How repairable is your phone?">
  <meta property="og:description" content="A short quiz. For official phone-by-phone breakdowns, see iFixit.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23111' width='32' height='32'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html { background: #fff; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #111;
      background: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }
    .label {
      margin: 0 0 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    #step { margin-bottom: 1.1rem; }
    h1 {
      margin: 0;
      max-width: 18em;
      font-size: clamp(2.15rem, 5vw, 3.4rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.02;
    }
    .intro {
      max-width: 36rem;
      margin: 1rem 0 0;
    }
    .intro[hidden] { display: none; }
    .intro a, footer a { color: #111; }
    main { margin-top: 2.5rem; }
    h2 {
      margin: 0 0 1rem;
      font-size: clamp(1.7rem, 4vw, 2.15rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .options { display: grid; }
    .option {
      width: 100%;
      text-align: left;
      color: #111;
      background: #fff;
      border: 1px solid #111;
      margin-top: -1px;
      padding: 0.95rem 1rem;
      font: inherit;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .option:hover,
    .option[aria-pressed="true"] {
      background: #111;
      color: #fff;
      position: relative;
      z-index: 1;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }
    .texty, .solid {
      font: inherit;
      cursor: pointer;
    }
    .texty {
      background: none;
      border: 0;
      padding: 0.4rem 0;
      color: #111;
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    .texty:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      text-decoration: none;
    }
    .solid {
      color: #fff;
      background: #111;
      border: 1px solid #111;
      padding: 0.8rem 1rem;
    }
    .solid:hover { background: #fff; color: #111; }
    .note { margin: 0.8rem 0 0; max-width: 36rem; }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #111;
      max-width: 36rem;
    }
    #toast {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      background: #111;
      color: #fff;
      padding: 0.55rem 0.75rem;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
    :focus-visible { outline: 2px solid #111; outline-offset: 3px; }
    ::selection { background: #111; color: #fff; }
  </style>
</head>
<body>
  <div class="page">
    <p class="label">How repairable is your phone?</p>
    <p class="label" id="step">1 of 3</p>
    <h1 id="title">Can you open it and take the battery out?</h1>
    <p class="intro" id="intro">Three questions about the phone in your hand.</p>
    <main id="stage"></main>
    <footer>
      <p>For an official breakdown of a specific phone, see <a href="https://www.ifixit.com/repairability/smartphone-repairability-scores">iFixit’s smartphone repairability scores</a>. This quiz does not score individual phones.</p>
    </footer>
  </div>
  <div id="toast" role="status"></div>
  <script>
    const QUESTIONS = [
      {
        title: "Can you open it and take the battery out?",
        options: [
          { id: "yes", label: "Yes", note: "It opens, and the battery comes out." },
          { id: "some", label: "I can open it, but the battery is stuck", note: "The battery is stuck in place." },
          { id: "no", label: "No", note: "Getting the battery out is not realistic." },
          { id: "unsure", label: "Not sure", note: "It’s unclear whether the battery comes out.", unsure: true }
        ]
      },
      {
        title: "Can you replace the screen, and buy the part?",
        options: [
          { id: "yes", label: "Yes", note: "The screen can be replaced, and the part is sold." },
          { id: "some", label: "The part exists, but the job is hard", note: "A screen part exists, but fitting it is hard." },
          { id: "no", label: "No", note: "A new screen is not a practical repair." },
          { id: "unsure", label: "Not sure", note: "It’s unclear whether the screen can be replaced.", unsure: true }
        ]
      },
      {
        title: "After a new part is in, does the phone work as before?",
        options: [
          { id: "yes", label: "Yes", note: "A new part works." },
          { id: "some", label: "It warns me, then works", note: "A new part works, after a warning." },
          { id: "no", label: "No. Some features stop", note: "The phone may reject a new part." },
          { id: "unsure", label: "Not sure", note: "It’s unclear whether a new part will be accepted.", unsure: true }
        ]
      }
    ];

    const state = { step: 0, picks: [], timer: null, replaceNext: true };

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function chosen() {
      return state.picks.map((id, i) => QUESTIONS[i].options.find((o) => o.id === id)).filter(Boolean);
    }

    function outcome(options) {
      const unsure = options.filter((o) => o.unsure).length;
      const nos = options.filter((o) => o.id === "no").length;
      const yes = options.filter((o) => o.id === "yes").length;
      if (unsure >= 2) {
        return {
          title: "Hard to say",
          line: "Too many answers were not sure. Check whether the battery comes out, and whether you can buy a part."
        };
      }
      if (nos >= 2) {
        return {
          title: "Hard to repair",
          line: "A home repair is difficult."
        };
      }
      if (yes === QUESTIONS.length) {
        return {
          title: "Easy to repair",
          line: "You can open it, get a part, and the phone should work after the repair."
        };
      }
      return {
        title: "Repairable, but it takes work",
        line: "A repair is possible. At least one step is awkward."
      };
    }

    function currentUrl() {
      const url = new URL(location.href);
      url.search = "";
      url.hash = "";
      if (state.step >= QUESTIONS.length && state.picks.length === QUESTIONS.length) {
        url.searchParams.set("a", state.picks.join("."));
      } else if (state.step > 0 || state.picks.some(Boolean)) {
        url.searchParams.set("q", String(state.step));
        if (state.picks.some(Boolean)) url.searchParams.set("a", state.picks.map((id) => id || "").join("."));
      }
      return url;
    }

    function snapshot() {
      return { step: state.step, picks: state.picks.slice() };
    }

    function clearTimer() {
      if (state.timer) clearTimeout(state.timer);
      state.timer = null;
    }

    function show(step) {
      clearTimer();
      state.step = step;
      const url = currentUrl();
      const data = snapshot();
      if (state.replaceNext) {
        history.replaceState(data, "", url);
        state.replaceNext = false;
      } else {
        history.pushState(data, "", url);
      }
      render();
    }

    function toast(text) {
      const node = document.getElementById("toast");
      node.textContent = text;
      node.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => node.classList.remove("show"), 1400);
    }

    async function copyLink() {
      const link = currentUrl().href;
      try {
        await navigator.clipboard.writeText(link);
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = link;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      toast("Link copied");
    }

    function renderQuestion() {
      const q = QUESTIONS[state.step];
      const options = q.options.map((o, i) => (
        '<button class="option" type="button" data-act="choose" data-id="' + esc(o.id) + '" aria-pressed="' + (state.picks[state.step] === o.id) + '">' + (i + 1) + ".  " + esc(o.label) + "</button>"
      )).join("");
      return (
        '<div class="options">' + options + "</div>" +
        '<div class="nav"><button class="texty" type="button" data-act="back"' + (state.step === 0 ? " disabled" : "") + ">Back</button></div>"
      );
    }

    function renderResult() {
      const options = chosen();
      const result = outcome(options);
      const notes = options.filter((o) => o.id !== "yes").map((o) => "<p class=\"note\">" + esc(o.note) + "</p>").join("");
      return (
        '<p class="note">' + esc(result.line) + "</p>" +
        notes +
        '<div class="nav"><button class="solid" type="button" data-act="again">Start again</button><button class="texty" type="button" data-act="copy">Copy link</button></div>'
      );
    }

    function render() {
      const done = state.step >= QUESTIONS.length;
      const result = done ? outcome(chosen()) : null;
      document.getElementById("step").textContent = done ? "Result" : (state.step + 1) + " of " + QUESTIONS.length;
      document.getElementById("title").textContent = done ? result.title : QUESTIONS[state.step].title;
      document.getElementById("intro").hidden = state.step !== 0;
      document.getElementById("stage").innerHTML = done ? renderResult() : renderQuestion();
      document.title = done ? result.title + " — How repairable is your phone?" : "How repairable is your phone?";
    }

    function choose(id) {
      clearTimer();
      state.picks[state.step] = id;
      state.picks = state.picks.slice(0, state.step + 1);
      const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 180;
      state.timer = setTimeout(() => show(state.step + 1), delay);
      render();
    }

    function readUrl() {
      const params = new URLSearchParams(location.search);
      const raw = params.get("a");
      const picks = raw ? raw.split(".") : [];
      const valid = picks.length > 0 && picks.every((id, i) => QUESTIONS[i] && QUESTIONS[i].options.some((o) => o.id === id));
      if (valid && picks.length === QUESTIONS.length && !params.has("q")) {
        state.step = QUESTIONS.length;
        state.picks = picks;
        return;
      }
      if (params.has("q")) {
        const step = Number(params.get("q"));
        state.step = Number.isFinite(step) ? Math.max(0, Math.min(QUESTIONS.length - 1, step)) : 0;
        state.picks = valid ? picks : [];
      }
    }

    function init() {
      readUrl();
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-act]");
        if (!button) return;
        const act = button.dataset.act;
        if (act === "choose") choose(button.dataset.id);
        else if (act === "back") { if (state.step > 0) show(state.step - 1); }
        else if (act === "again") {
          state.picks = [];
          show(0);
        }
        else if (act === "copy") copyLink();
      });
      document.addEventListener("keydown", (event) => {
        if (state.step >= QUESTIONS.length) return;
        if (event.key < "1" || event.key > "4") return;
        const option = QUESTIONS[state.step].options[Number(event.key) - 1];
        if (option) choose(option.id);
      });
      window.addEventListener("popstate", (event) => {
        clearTimer();
        const data = event.state;
        state.step = data ? data.step : 0;
        state.picks = data && data.picks ? data.picks : [];
        state.replaceNext = false;
        render();
      });
      state.replaceNext = true;
      history.replaceState(snapshot(), "", currentUrl());
      state.replaceNext = false;
      render();
    }

    init();
  </script>
</body>
</html>
