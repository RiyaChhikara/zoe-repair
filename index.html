<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#06110d">
  <title>Zoe — How repairable is your phone?</title>
  <meta name="description" content="A shareable field guide that scores how repairable your phone is, from sealed amber to open meadow.">
  <meta property="og:title" content="Zoe — How repairable is your phone?">
  <meta property="og:description" content="A score from 0 to 10 for the life still left in a phone. Look yours up, or answer seven questions.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,620;1,9..144,500;1,9..144,640&family=Outfit:wght@320;420;520;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss: #06110d;
      --ink: #f3f0e6;
      --muted: #b7c9bb;
      --leaf: #d7f29a;
      --glow: #9ff5d4;
      --pollen: #f3d7a6;
      --blush: #f0b7c3;
      --line: rgba(243, 215, 166, 0.22);
      --sheet: rgba(7, 22, 17, 0.72);
      --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--moss); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 420;
      font-size: 1.05rem;
      line-height: 1.5;
      background:
        radial-gradient(ellipse 55vw 45vw at 88% -8%, rgba(243, 215, 166, 0.22), transparent 70%),
        radial-gradient(ellipse 48vw 42vw at -10% 100%, rgba(80, 210, 170, 0.16), transparent 68%),
        radial-gradient(ellipse 40vw 30vw at 70% 110%, rgba(120, 160, 60, 0.14), transparent 70%),
        var(--moss);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
      z-index: 0;
    }
    .scene { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .mycelium { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; }
    .fern { position: absolute; width: min(280px, 42vw); height: auto; opacity: 0.45; }
    .fern-left { left: -40px; bottom: -20px; }
    .fern-right { right: -50px; top: 40px; transform: scaleX(-1); opacity: 0.28; }
    .spore {
      position: absolute;
      bottom: -12px;
      width: var(--s);
      height: var(--s);
      left: var(--x);
      border-radius: 50%;
      background: var(--glow);
      opacity: 0.45;
      animation: rise var(--d) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes rise {
      from { transform: translateY(0); opacity: 0; }
      12% { opacity: 0.55; }
      to { transform: translateY(-105vh); opacity: 0; }
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 4rem;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .mark {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 560;
      font-size: 1.85rem;
      color: var(--pollen);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .top-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .kicker {
      margin: 0 0 0.8rem;
      color: var(--pollen);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.74rem;
    }
    h1, h2, .phone-name, .biome-name { font-family: var(--serif); font-weight: 560; letter-spacing: -0.03em; }
    h1 {
      margin: 0;
      font-size: clamp(3.1rem, 8vw, 6.5rem);
      line-height: 0.9;
      font-weight: 560;
    }
    h1 em, .biome-name em { font-style: italic; font-weight: 560; color: var(--leaf); }
    .lede {
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.12rem;
      margin: 1.25rem 0 0;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.6rem; }
    button, .btn {
      font-family: var(--sans);
      cursor: pointer;
    }
    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      font-weight: 520;
      color: #142016;
      background: linear-gradient(180deg, #eaf8c8, #c6e57a);
    }
    .btn.ghost {
      color: var(--ink);
      background: transparent;
      border-color: var(--line);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .scale {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.4rem;
      margin-top: 2.4rem;
      max-width: 46rem;
    }
    .scale i {
      display: block;
      height: 3px;
      border-radius: 99px;
      background: var(--c);
      opacity: 0.85;
    }
    .scale span {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .home-grid { display: grid; gap: 1rem; }
    .relic { justify-self: start; }
    .relic svg { width: min(220px, 58vw); height: auto; display: block; }
    .fig {
      margin: 0.4rem 0 0;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }
    .sheet {
      margin-top: 0.5rem;
      padding: clamp(1.2rem, 3vw, 2rem);
      border-radius: 28px 42px 30px 36px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015)),
        var(--sheet);
      border: 1px solid var(--line);
      box-shadow: 0 30px 70px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
    }
    label.seek { display: block; }
    .seek span {
      display: block;
      margin-bottom: 0.45rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    input[type="search"] {
      width: 100%;
      font: inherit;
      font-size: 1.05rem;
      color: var(--ink);
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.85rem 1.1rem;
    }
    input[type="search"]:focus { outline: 2px solid var(--glow); outline-offset: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.9rem 0; }
    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.7rem;
      font: inherit;
      font-size: 0.82rem;
    }
    .chip.on { color: #142016; background: var(--leaf); border-color: transparent; }
    .list { max-height: min(52vh, 460px); overflow: auto; margin-top: 0.3rem; }
    .group-label {
      margin: 1rem 0 0.15rem;
      color: var(--pollen);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }
    .phone-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid rgba(243, 215, 166, 0.12);
      color: inherit;
      padding: 0.85rem 0.15rem;
      font: inherit;
    }
    .phone-row .name { font-family: var(--serif); font-size: 1.35rem; letter-spacing: -0.02em; }
    .phone-row .year { color: var(--muted); font-variant-numeric: tabular-nums; }
    .phone-row:hover .name { color: var(--leaf); }
    .empty { padding: 1.2rem 0 0.4rem; color: var(--muted); }
    .q-top { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .step-no { color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.12em; font-size: 0.78rem; }
    .vine { display: flex; gap: 0.35rem; margin: 0.8rem 0 1.2rem; }
    .vine b {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: rgba(243, 215, 166, 0.18);
    }
    .vine b.on { background: var(--leaf); }
    h2 { margin: 0; font-size: clamp(2rem, 5vw, 3.3rem); line-height: 1.02; }
    .hint { color: var(--muted); margin: 0.7rem 0 1.1rem; }
    .options { display: grid; gap: 0.55rem; }
    .option {
      text-align: left;
      color: var(--ink);
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(243, 215, 166, 0.14);
      border-radius: 18px 22px 16px 20px;
      padding: 0.9rem 1rem;
      font: inherit;
      font-size: 1.02rem;
      line-height: 1.35;
    }
    .option:hover, .option[aria-pressed="true"] {
      border-color: rgba(215, 242, 154, 0.7);
      background: rgba(215, 242, 154, 0.1);
    }
    .option small {
      display: block;
      margin-bottom: 0.15rem;
      color: var(--pollen);
      letter-spacing: 0.14em;
      font-size: 0.68rem;
    }
    .row-nav { display: flex; justify-content: space-between; margin-top: 1.1rem; }
    .texty {
      background: none;
      border: 0;
      color: var(--pollen);
      padding: 0.4rem 0;
      font: inherit;
    }
    .texty:disabled { opacity: 0.35; cursor: not-allowed; }
    .result-head { display: grid; gap: 1rem; }
    .ring-wrap { position: relative; width: 210px; height: 210px; }
    .ring-wrap svg { width: 100%; height: 100%; }
    .ring-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
    }
    .ring-label strong {
      font-family: var(--serif);
      font-weight: 560;
      font-size: 3.4rem;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .ring-label span { color: var(--muted); font-size: 0.85rem; }
    .progress {
      fill: none;
      stroke: var(--biome);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 534;
      stroke-dashoffset: calc(534 * (1 - var(--p)));
      transition: stroke-dashoffset 0.9s ease;
    }
    .biome-name { margin: 0.2rem 0 0; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 0.95; }
    .latin { margin: 0.35rem 0 0; letter-spacing: 0.2em; text-transform: uppercase; color: var(--pollen); font-size: 0.72rem; }
    .poem { font-family: var(--serif); font-style: italic; font-size: 1.25rem; line-height: 1.35; margin: 0.8rem 0 0; }
    .notes { padding: 0; margin: 1rem 0 0; list-style: none; }
    .notes li {
      padding: 0.7rem 0;
      border-top: 1px solid rgba(243, 215, 166, 0.14);
      color: var(--ink);
    }
    .bars { margin-top: 1.2rem; display: grid; gap: 0.55rem; }
    .bar-row { display: grid; grid-template-columns: 7.2rem 1fr auto; gap: 0.6rem; align-items: center; font-size: 0.85rem; }
    .track { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .track span { display: block; height: 100%; width: calc(var(--v) * 100%); background: linear-gradient(90deg, var(--glow), var(--leaf)); border-radius: inherit; }
    .pts { color: var(--muted); font-variant-numeric: tabular-nums; }
    .cut { color: var(--blush); }
    details { margin-top: 1rem; color: var(--muted); }
    summary { cursor: pointer; color: var(--pollen); }
    .share { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.2rem; }
    footer {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto 2rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    footer a { color: var(--glow); }
    #toast {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%) translateY(12px);
      background: var(--leaf);
      color: #142016;
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
    :focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
    ::selection { background: var(--leaf); color: #102016; }
    @media (min-width: 900px) {
      .wrap { padding-top: 1.8rem; }
      .home-grid { grid-template-columns: minmax(0, 1.35fr) minmax(220px, 0.55fr); align-items: end; gap: 2rem; }
      .relic { justify-self: end; }
      .result-head { grid-template-columns: 210px 1fr; align-items: center; gap: 1.6rem; }
    }
    @media (max-width: 640px) {
      .top-note { display: none; }
      .scale span { font-size: 0.58rem; letter-spacing: 0.02em; }
      .bar-row { grid-template-columns: 5.6rem 1fr auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <div class="wrap">

  <footer>
    <p>Zoe is an independent reading, scored from how a phone opens, whether the battery and screen can leave, and whether parts, a manual, and the software will allow the repair. It is not an iFixit score. Official teardowns live on <a href="https://www.ifixit.com/repairability/smartphone-repairability-scores">iFixit’s smartphone repairability scores</a>.</p>

      ["port", "Charge port"],
      ["pairing", "Software"],

    const BIOMES = [
      { min: 0, name: "Sealed amber", latin: "Resina", color: "#e7a15a", poem: "Beautiful, and closed. The phone can be used. It does not want to be opened." },

    const LOW_NOTE = {
      battery: "The battery is the difficult root. If the cell stays glued in, the phone lives one battery at a time.",

      screws: "Ordinary fasteners. The tools you already have are enough."

    const RAISE = {

    function scoreParts(t) {
      let mech = 0;
      let support = 0;
      MECH.forEach((k) => { mech += (Number(t[k]) || 0) * WEIGHTS[k]; });
      SUPPORT.forEach((k) => { support += (Number(t[k]) || 0) * WEIGHTS[k]; });
      const mechUsed = t.fold ? mech * FOLD_MECH : mech;
      let lock = 0;
      if ((Number(t.pairing) || 0) < LOCK_BELOW) {
        lock = ((Number(t.parts) || 0) * WEIGHTS.parts + (Number(t.guides) || 0) * WEIGHTS.guides) * LOCK_RATE;
      }
      const raw = Math.max(0, Math.min(10, mechUsed + support - lock));
      return {
        mech, mechUsed, support, lock,
        foldCut: mech - mechUsed,
        score: Math.round(raw * 10) / 10
      };
    }

    function scoreOf(t) { return scoreParts(t).score; }

    function biomeFor(score) {
      let biome = BIOMES[0];
      BIOMES.forEach((b) => { if (score >= b.min) biome = b; });
      return biome;

      return t;

      if ((Number(t.pairing) || 0) < LOCK_BELOW) notes.push("Software that refuses a spare part pulls the score down.");
      const ranked = FACTORS.map(([k, label]) => ({ k, label, v: Number(t[k]) || 0 })).sort((a, b) => a.v - b.v);

      const u = new URL(location.href);

      if (state.timer) clearTimeout(state.timer);

      clearTimer();

      const url = currentUrl();
      const data = snapshot();
      if (state.replaceNext) {

    function showToast(text) {

      showToast._t = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    async function copyText(text, ok) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(ok);
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        showToast(ok);
      }
    }

              '<circle cx="154" cy="224" r="3" fill="#9ff5d4"/>' +
              '<circle cx="100" cy="92" r="2.4" fill="#f3d7a6"/>' +
            "</svg>" +
            "<figcaption class=\"fig\">Fig. 01 — living circuit</figcaption>" +
          "</figure>" +
        "</div>"
      );
    }

    function renderPick() {
      const brands = ["All"].concat([...new Set(PHONES.map((p) => p.brand))]);
      const chips = brands.map((b) => (
        '<button class="chip' + (b === state.brand ? " on" : "") + '" type="button" data-act="brand" data-brand="' + esc(b) + '" aria-pressed="' + (b === state.brand) + '">' + esc(b) + "</button>"
      )).join("");
      return (
        '<section class="sheet">' +
          '<p class="kicker">Specimen index · ' + PHONES.length + " phones</p>" +
          '<h2>Find the phone.</h2>' +
          '<p class="hint">Newest in this guide run from 2022 to 2025. Anything else takes the seven questions.</p>' +
          '<label class="seek"><span>Search</span><input id="q" type="search" placeholder="Fairphone, Pixel, iPhone…" value="' + esc(state.q) + '" autocomplete="off"></label>' +
          '<div class="chips">' + chips + "</div>" +
          '<div class="list" id="list">' + listHtml() + "</div>" +
          '<div class="row-nav"><button class="texty" type="button" data-act="home">Back</button><button class="texty" type="button" data-act="quiz">Mine isn’t listed</button></div>' +
        "</section>"
      );
    }

    function renderQuiz() {
      const q = QUESTIONS[state.step];
      const vine = QUESTIONS.map((_, i) => '<b class="' + (i <= state.step ? "on" : "") + '"></b>').join("");
      const options = q.options.map((o, i) => (
        '<button class="option" type="button" data-act="choose" data-id="' + esc(o.id) + '" aria-pressed="' + (state.picks[state.step] === o.id) + '"><small>' + String(i + 1).padStart(2, "0") + "</small>" + esc(o.label) + "</button>"
      )).join("");
      return (
        '<section class="sheet">' +
          '<div class="q-top"><p class="kicker">' + esc(q.kicker) + '</p><p class="step-no">' + String(state.step + 1).padStart(2, "0") + " / 07</p></div>" +
          '<div class="vine" aria-hidden="true">' + vine + "</div>" +
          "<h2>" + esc(q.title) + "</h2>" +
          '<p class="hint">' + esc(q.hint) + "</p>" +
          '<div class="options">' + options + "</div>" +
          '<div class="row-nav"><button class="texty" type="button" data-act="back"' + (state.step === 0 ? " disabled" : "") + '>Back</button><span class="step-no">Keys 1–' + q.options.length + "</span></div>" +
        "</section>"
      );
    }

    function renderResult() {
      const device = state.phoneId ? findPhone(state.phoneId) : null;
      const traits = device ? Object.assign({ unsure: 0 }, device.traits) : traitsFromPicks(state.picks);
      const parts = scoreParts(traits);
      const biome = biomeFor(parts.score);
      const notes = fieldNotes(traits, device);
      const title = device ? device.name : "Your phone";
      const year = device ? String(device.year) : "Answered by hand";
      const low = FACTORS.map(([k]) => k).sort((a, b) => (Number(traits[a]) || 0) - (Number(traits[b]) || 0))[0];
      const bars = FACTORS.map(([k, label]) => (
        '<div class="bar-row"><span>' + label + '</span><div class="track"><span style="--v:' + (Number(traits[k]) || 0) + '"></span></div><span class="pts">' + ((Number(traits[k]) || 0) * WEIGHTS[k]).toFixed(1) + "</span></div>"
      )).join("");
      const extras = [];
      if (traits.fold) extras.push('<div class="bar-row"><span>Foldable</span><div class="track"></div><span class="pts cut">−' + parts.foldCut.toFixed(1) + "</span></div>");
      if (parts.lock) extras.push('<div class="bar-row"><span>Software lock</span><div class="track"></div><span class="pts cut">−' + parts.lock.toFixed(1) + "</span></div>");
      const lift = parts.score < 8.5 ? '<p class="hint">What would lift it: ' + esc(RAISE[low]) + "</p>" : "";
      return (
        '<section class="sheet" style="--biome:' + biome.color + '">' +
          '<p class="sr-only">Score ' + parts.score.toFixed(1) + " out of 10. " + esc(biome.name) + ".</p>" +
          '<p class="kicker">Herbarium · ' + esc(year) + "</p>" +
          '<div class="result-head">' +
            '<div class="ring-wrap">' +
              '<svg viewBox="0 0 240 240" aria-hidden="true">' +
                '<circle cx="120" cy="120" r="100" fill="none" stroke="rgba(243,215,166,0.15)" stroke-width="1"/>' +
                '<circle cx="120" cy="120" r="78" fill="none" stroke="rgba(159,245,212,0.18)" stroke-width="1"/>' +
                '<circle cx="120" cy="120" r="56" fill="none" stroke="rgba(215,242,154,0.16)" stroke-width="1"/>' +
                '<circle class="progress" cx="120" cy="120" r="85" transform="rotate(-90 120 120)" style="--p:0"></circle>' +
              "</svg>" +
              '<div class="ring-label"><strong>' + parts.score.toFixed(1) + '</strong><span>out of 10</span></div>' +
            "</div>" +
            "<div>" +
              '<h2>' + esc(title) + "</h2>" +
              '<p class="biome-name"><em>' + esc(biome.name) + "</em></p>" +
              '<p class="latin">' + esc(biome.latin) + "</p>" +
              '<p class="poem">' + esc(biome.poem) + "</p>" +
            "</div>" +
          "</div>" +
          '<ul class="notes">' + notes.map((n) => "<li>" + esc(n) + "</li>").join("") + "</ul>" +
          '<div class="bars">' + bars + extras + "</div>" +
          lift +
          '<div class="share">' +
            '<button class="btn" type="button" data-act="copy-link">Copy link</button>' +
            '<button class="btn ghost" type="button" data-act="copy-caption">Copy caption</button>' +
            '<button class="btn ghost" type="button" data-act="native-share">Share</button>' +
          "</div>" +
          '<div class="row-nav">' +
            '<button class="texty" type="button" data-act="pick">Another phone</button>' +
            '<button class="texty" type="button" data-act="quiz">' + (device ? "These details feel wrong" : "Answer again") + "</button>" +
          "</div>" +
          '<details><summary>How this number is made</summary><p>Battery 2, screen 1.6, opening 1.3, spare parts 1.6, guides 1, charge port 0.8, software 1, fasteners 0.7. A foldable keeps about three fifths of its mechanical points. If software rejects spare parts, most of the parts-and-guides credit is removed. The result is rounded to one decimal and capped at 10. Known phones use public design traits — glue, screws, parts, manuals — not a copied scorecard.</p></details>' +
        "</section>"
      );
    }

    function render() {
      const stage = document.getElementById("stage");
      if (state.view === "home") stage.innerHTML = renderHome();
      else if (state.view === "pick") stage.innerHTML = renderPick();
      else if (state.view === "quiz") stage.innerHTML = renderQuiz();
      else stage.innerHTML = renderResult();

      const device = state.phoneId ? findPhone(state.phoneId) : null;
      if (state.view === "result") {
        const traits = device ? device.traits : traitsFromPicks(state.picks);
        const score = scoreOf(traits);
        const biome = biomeFor(score);
        document.title = (device ? device.name : "Your phone") + " · " + score.toFixed(1) + " on Zoe";
        const ring = stage.querySelector(".progress");
        const paint = () => { if (ring) ring.style.setProperty("--p", String(score / 10)); };
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) paint();
        else requestAnimationFrame(() => requestAnimationFrame(paint));
        const shareBtn = stage.querySelector('[data-act="native-share"]');
        if (shareBtn && !navigator.share) shareBtn.hidden = true;
      } else {
        document.title = "Zoe — How repairable is your phone?";
      }

      const heading = stage.querySelector("h1, h2");
      if (heading && state.view !== "pick") heading.setAttribute("tabindex", "-1");
      if (state.view === "pick") {
        const input = document.getElementById("q");
        if (input) {
          input.focus();
          const end = input.value.length;
          input.setSelectionRange(end, end);
        }
      }
    }

    function choose(id) {
      clearTimer();
      state.picks[state.step] = id;
      state.picks = state.picks.slice(0, state.step + 1);
      const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 260;
      state.timer = setTimeout(() => {
        if (state.step < QUESTIONS.length - 1) go("quiz", { step: state.step + 1 });
        else go("result", { phoneId: null });
      }, delay);
      render();
    }

    function caption() {
      const device = state.phoneId ? findPhone(state.phoneId) : null;
      const traits = device ? device.traits : traitsFromPicks(state.picks);
      const score = scoreOf(traits);
      const biome = biomeFor(score);
      const name = device ? device.name : "My phone";
      return name + " is " + biome.name.toLowerCase() + " — " + score.toFixed(1) + "/10 on Zoe, a field guide to phone repairability.\n" + currentUrl().href;
    }

    function onClick(event) {
      const button = event.target.closest("[data-act]");
      if (!button) return;
      const act = button.dataset.act;
      if (act === "home") go("home", { phoneId: null });
      else if (act === "pick") go("pick", { phoneId: null });
      else if (act === "quiz") go("quiz", { step: 0, picks: [], phoneId: null });
      else if (act === "phone") go("result", { phoneId: button.dataset.id });
      else if (act === "brand") {
        state.brand = button.dataset.brand;
        const list = document.getElementById("list");
        if (list) list.innerHTML = listHtml();
        document.querySelectorAll("[data-act='brand']").forEach((chip) => {
          const on = chip.dataset.brand === state.brand;
          chip.classList.toggle("on", on);
          chip.setAttribute("aria-pressed", on ? "true" : "false");
        });
      } else if (act === "choose") choose(button.dataset.id);
      else if (act === "back") {
        if (state.step === 0) go("home");
        else go("quiz", { step: state.step - 1 });
      } else if (act === "copy-link") copyText(currentUrl().href, "Link copied");
      else if (act === "copy-caption") copyText(caption(), "Caption copied");
      else if (act === "native-share") {
        const device = state.phoneId ? findPhone(state.phoneId) : null;
        navigator.share({
          title: document.title,
          text: caption().split("\n")[0],
          url: currentUrl().href
        }).catch(() => {});
      }
    }

    function readUrl() {
      const params = new URLSearchParams(location.search);
      const phoneId = params.get("phone");
      const read = params.get("read");
      const view = params.get("view");
      if (phoneId && findPhone(phoneId)) {
        state.view = "result";
        state.phoneId = phoneId;
        return;
      }
      const picks = read ? read.split(".") : [];
      if (view === "quiz") {
        state.view = "quiz";
        state.step = Math.max(0, Math.min(QUESTIONS.length - 1, Number(params.get("step")) || 0));
        state.picks = picks;
        return;
      }
      if (view === "pick") {
        state.view = "pick";
        return;
      }
      if (read && picks.length === QUESTIONS.length && picks.every((id, i) => QUESTIONS[i].options.some((o) => o.id === id))) {
        state.view = "result";
        state.picks = picks;
        state.phoneId = null;
      }
    }

    function init() {
      readUrl();
      document.addEventListener("click", onClick);
      document.addEventListener("input", (event) => {
        if (event.target.id !== "q") return;
        state.q = event.target.value;
        const list = document.getElementById("list");
        if (list) list.innerHTML = listHtml();
      });
      document.addEventListener("keydown", (event) => {
        if (event.target.id === "q" && event.key === "Enter") {
          const phones = filteredPhones();
          if (phones.length === 1) go("result", { phoneId: phones[0].id });
          return;
        }
        if (state.view !== "quiz") return;
        if (event.key < "1" || event.key > "9") return;
        const option = QUESTIONS[state.step].options[Number(event.key) - 1];
        if (option) choose(option.id);
      });
      window.addEventListener("popstate", (event) => {
        clearTimer();
        const data = event.state;
        if (!data) {
          state.view = "home";
          state.phoneId = null;
          state.step = 0;
          state.picks = [];
        } else {
          state.view = data.view;
          state.step = data.step || 0;
          state.picks = data.picks || [];
          state.phoneId = data.phoneId || null;
          state.brand = data.brand || "All";
          state.q = data.q || "";
        }
        state.replaceNext = false;
        render();
      });
      state.replaceNext = true;
      const url = currentUrl();
      history.replaceState(snapshot(), "", url);
      state.replaceNext = false;
      render();
    }

    globalThis.ZOE = { scoreOf, scoreParts, PHONES, QUESTIONS, biomeFor, traitsFromPicks, BIOMES };
    if (typeof document !== "undefined") init();
  </script>
</body>
</html>
